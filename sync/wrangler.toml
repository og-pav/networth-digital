name = "networth-routine-sync"
main = "worker.js"
compatibility_date = "2026-01-01"

# Created with:  npx wrangler kv namespace create ROUTINE
# Paste the printed id below, then:  npx wrangler deploy
[[kv_namespaces]]
binding = "ROUTINE"
id = "PASTE_NAMESPACE_ID_HERE"

# `wrangler dev` uses a local namespace automatically, so the endpoint can be
# tested end to end before any Cloudflare account exists.
